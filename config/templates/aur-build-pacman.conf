# Fixed official-only pacman configuration for the disposable AUR build chroot.
# The target's mirrorlist supplies server URLs; archlinuxcn is intentionally absent.
[options]
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
