# Dedicated VM launcher configuration: no host-specific absolute include path.
font=JetBrainsMono Nerd Font:size=11
prompt=" "
placeholder=Search…
icon-theme=hicolor
icons-enabled=yes
match-mode=fzf
lines=8
width=32
horizontal-pad=16
vertical-pad=10
inner-pad=10
line-height=22
layer=overlay

[border]
width=2
radius=12

[colors]
background=111318ee
text=e1e2e9ff
prompt=a5c8feff
placeholder=c3c6cfff
input=e1e2e9ff
match=a5c8feff
selection=3d4758ff
selection-text=d8e3f8ff
selection-match=a5c8feff
counter=c3c6cfff
border=a5c8feff

[dmenu]
mode=text
