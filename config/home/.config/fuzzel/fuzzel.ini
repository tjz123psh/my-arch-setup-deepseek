# fuzzel 静态结构配置（字体/圆角/边框/间距/尺寸）。
# 颜色由 DMS matugen 动态生成到 colors.ini，随壁纸/主题色自动变。
# 结构与颜色分离，避免 matugen 重生成时覆盖此文件。参见 ~/md/linux。

font=JetBrainsMono Nerd Font:size=11
dpi-aware=auto
prompt=" "
placeholder=搜索…
icon-theme=hicolor
icons-enabled=yes
match-mode=fzf
lines=8
width=32
horizontal-pad=16
vertical-pad=10
inner-pad=10
line-height=22
letter-spacing=0
layer=overlay
tabs=4
include=/home/pang/.config/fuzzel/colors.ini

[border]
width=2
radius=12

[dmenu]
mode=text
